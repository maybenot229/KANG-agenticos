# permissions.toml — grant truth (D003: diffable, hand-editable in recovery).
# Shipped default the installer copies to %KANG_HOME%/config/ (17 §8). The
# file is truth; the loaded engine is a snapshot (05 §8, drift: file wins).
#
# Each principal maps to its granted capability scopes (family:qualifier).
# Default-deny: a principal absent here, or a scope absent from its list, is
# denied (SEC-004). Wildcards (`*`) are reserved for `kang` (pairing lint).

[grants]
# Kang acting through the UI holds all authority — the one exempt principal.
"kang" = ["*"]

# The kernel bus publishes core-namespace facts on the truth the kernel owns
# (EB-010: domain services and the kernel publish; agents never publish
# directly). Domain-service principals gain their own events.publish grants
# as those services arrive.
"kernel:bus" = ["events.publish:kang"]

# The task domain service publishes task.* truth (task.created / task.updated)
# on the task list it owns (EB-010). The API's task.create handler publishes
# under this principal, not the requester's.
"kernel:tasks" = ["events.publish:kang"]

# The deadline domain service publishes deadline.* truth (created/updated)
# and the deadline.approaching fact on the deadlines it owns (EB-010). The
# API's deadline handlers publish under this principal, not the requester's.
"kernel:deadlines" = ["events.publish:kang"]

# The notifier publishes notification.requested — the accelerant over the
# queue row it just wrote (15 §6.2). It publishes nothing else.
"kernel:notifier" = ["events.publish:kang"]

# The Planner announces plan.generated. It stamps plan_date through the task
# domain's principal (kernel:tasks), so this grant covers the announcement
# only — the Planner owns the plan, not the tasks.
"kernel:planner" = ["events.publish:kang"]

# The project domain service publishes project.created — the entity's own
# truth (EB-010). ADR-013: project's first write path.
"kernel:projects" = ["events.publish:kang"]

# The competition domain service publishes competition.created — the
# entity's own truth (EB-010). ADR-014: competition's first write path.
"kernel:competitions" = ["events.publish:kang"]

# The milestone domain service publishes milestone.created — the entity's
# own truth (EB-010). ADR-015: milestone's first write path.
"kernel:milestones" = ["events.publish:kang"]

# The goal domain service publishes goal.created — the entity's own truth
# (EB-010). ADR-016: goal's first write path (the standing pattern
# ADR-013/014/015 established, first applied here).
"kernel:goals" = ["events.publish:kang"]

# The backup domain service publishes backup.offsite_stale — the fact
# that 07 Part XII.5's marker check found (EB-010). ADR-034: backup's
# first event-publishing path (backup.snapshot/.verify publish nothing).
"kernel:backups" = ["events.publish:kang"]

# The scheduler dispatches jobs through the ordinary operation pipeline
# (ADR-006), so it needs the scope of every operation it may trigger — and
# nothing more. Default-deny means this line IS the answer to "what can
# automation set off?", reviewable in one place. It holds no
# events.publish grant: the operations it invokes publish under their own
# domain principals. tasks.write (morning_plan -> plan.generate),
# held_actions.expire (held_action_expire -> held_action.expire, ADR-022).
#
# deadlines.mark_alerted (ADR-043) and backups.write/backups.read
# (ADR-045) both moved OFF this principal, 2026-09-16: deadline_sweep's
# and backup_monitor's own real triggers now run through the
# mechanical-agent envelope under their own agent:{id} principals below,
# not this one — least privilege following the actual caller, not a
# second copy of the same grant held by two principals for one operation.
"kernel:scheduler" = [
  "tasks.write",
  "held_actions.expire",
]

# ADR-043 (2026-09-16): deadline_sweep's real scheduled trigger now runs
# through the mechanical-agent envelope (ADR-041's run_mechanical_agent),
# so its session is minted for this principal, not kernel:scheduler.
# Exactly the one operation its own AgentDefinition names in `tools`
# (agents/definitions/deadline_sweep/deadline_sweep.toml) — the allowlist
# check there is independent of, and prior to, this grant (ADR-028 C4).
"agent:deadline_sweep" = ["deadlines.mark_alerted"]

# ADR-045 (2026-09-16): backup_monitor's three jobs (backup_snapshot,
# backup_verify, backup_offsite_check) now all run through the same
# mechanical-agent envelope, under this one principal — one agent, three
# jobs, matching its own AgentDefinition's `tools` (agents/definitions/
# backup_monitor/backup_monitor.toml: backup.snapshot, backup.verify,
# backup.offsite_check). backups.write covers the first two (same scope,
# same directory, ADR-031/032); backups.read covers the third (ADR-034 D2
# — it writes no file, a genuinely different scope, not a duplicate).
"agent:backup_monitor" = ["backups.write", "backups.read"]
