# KANG core packaging + tool configuration.
# Root-level file: packaging metadata has no other possible home; noted in the
# M0 build report (17 §2's list governs architectural directories).
# Languages fixed by D002: Python 3.12+ core.

[project]
name = "kang"
version = "0.1.0.dev0"
description = "KANG — local-first agentic personal OS (core)"
requires-python = ">=3.12"
# Runtime dependencies. Every addition needs the E10 justification paragraph
# in its PR (11_CODING §25).
# tzdata: Windows ships no IANA timezone database, so stdlib zoneinfo cannot
# resolve keys like "Asia/Kuching" without it (ADR-006 originally claimed
# zoneinfo "adds nothing" — corrected by ADR-006's 2026-07-31 amendment).
# Official, data-only, maintained by the CPython core team via PEP 615 — the
# boring choice for the one platform this line item exists to unblock.
# pydantic: request/response schema authority for the Operation Registry
# (ADR-009 Part B decided it; ADR-010 specifies layout/attachment/error
# mapping). Approved by Kang 2026-07-31.
# aiohttp: the operation channel's transport once the Core moves to
# 11_CODING §12's asyncio single-loop model (ADR-030's execution model +
# ADR-036's slice plan forced the question; ADR-035 ruled it, replacing
# stdlib http.server — a single, mature, single-purpose asyncio HTTP
# library, not a framework, chosen over ASGI (two dependencies for what
# this does with one) and over hand-rolling HTTP/1.1 parsing (reinvents a
# solved, non-trivial spec, the same reasoning ADR-011 used to reject a
# hand-rolled JSON-Schema parser). Approved by Kang 2026-09-13.
# anthropic: the official vendor SDK, declared ahead of its own first use
# (ADR-038 D1/D6, the same "declare ahead of the code" shape aiohttp used
# for ADR-035) — the real Anthropic ModelProvider adapter is its own next
# slice (needs a credential subsystem this one doesn't build). Typed
# request/response models match D010's structured-output discipline
# directly; the alternative (hand-rolling Anthropic's REST API against
# aiohttp) reinvents a solved problem the vendor already maintains for
# free, the same reasoning that already justified aiohttp itself one
# layer down. Approved by Kang 2026-09-14.
dependencies = ["tzdata", "pydantic", "aiohttp", "anthropic"]

[project.optional-dependencies]
# Dev toolchain named by the constitution itself:
# ruff for format+lint (11 §17 names "black/ruff"; ruff format is the
# black-compatible half chosen because black refuses to run on CPython
# 3.12.5 — one formatter, zero config debates), import-linter (11 §2),
# pytest (13_TESTING harness).
dev = [
    "ruff>=0.4",
    "import-linter>=2.0",
    "pytest>=8.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.ruff]
line-length = 88
target-version = "py312"
src = ["src", "tests", "tools"]

[tool.ruff.lint]
# E/F: correctness. I: import order. T20: print ban (11 §6/§25).
# BLE: bare/blind except ban (11 §9). DTZ: naive datetime.now surface (11 §14).
select = ["E", "F", "I", "T20", "BLE"]

[tool.ruff.lint.per-file-ignores]
# Tests and dev tools are the sanctioned omnivores; tools may print (they are
# CLIs, not src/ — the print ban is "print in src", 11 §25).
"tools/*" = ["T20"]
"tests/*" = ["T20"]
# The CLI is a client; stdout is its output surface — print is its job, not
# a stray debug line (the src print-ban is "print in src", 11 §25).
"cli/*" = ["T20"]
# The bus dispatcher is a DOCUMENTED supervision point: 11 §9 permits broad
# `except` at supervision points, and 15_EVENT_BUS §7/§13 (frozen) makes the
# bus one — "a failing handler never blocks siblings" requires capturing
# whatever an arbitrary handler raises. Scoped to this one module so the
# exemption cannot spread (the same discipline as the composition root).
"src/kang/kernel/bus/delivery.py" = ["BLE001"]
# The scheduler is the "job runner" named verbatim in 11 §9's closed list of
# supervision points: a failing job body is captured, recorded, and counted
# toward quarantine — it never escapes to abort catch-up of other jobs.
"src/kang/kernel/scheduler/scheduler.py" = ["BLE001"]
# The API dispatch is the ingress supervision point: API-006 requires EVERY
# failure to return the one error model — an unexpected exception becomes the
# `internal` envelope, never a dropped connection or a synthesized success.
"src/kang/api/dispatch.py" = ["BLE001"]
# ADR-036 D4 (resumed)/ADR-037: query_routing.py's _dispatch_query is the
# SAME API-006 ingress supervision point as dispatch.py's own dispatch() —
# it exists only because a read-pool-routed query dispatch cannot be
# dispatch()'s single atomic call (that would run the handler on the
# write-executor, defeating the read pool's purpose). It converts every
# failure across its three hops to the identical envelope dispatch() would
# have, via Dispatcher's own error_envelope.
"src/kang/kernel/runtime/query_routing.py" = ["BLE001"]

[tool.pytest.ini_options]
testpaths = ["tests"]
