# CI — commit tier per 11_CODING §17: format → lint contracts → unit,
# in order of cost. Red = no merge. CI config changes are reviewed like code.
# Later tiers (integration, normative suites per cadence) grow here with
# their components (18 §1.5: every stage pays its own testing bill).

name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  commit-tier:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -e ".[dev]"

      # 1 — format (zero config debates, ever)
      - name: Format (ruff format)
        run: ruff format --check src tests tools cli
      - name: Lint (ruff)
        run: ruff check src tests tools cli

      # 2 — lint contracts (imports, sizes, banned patterns, tree hygiene)
      - name: Import contracts (17 §4)
        run: lint-imports --config tools/importlinter.toml
      - name: Size limits (11 §4)
        run: python tools/lint_sizes.py src
      - name: Banned patterns (11 §25)
        run: python tools/lint_banned_patterns.py src
      - name: Tree hygiene (PS-002)
        run: python tools/lint_tree_hygiene.py .
      - name: Root docs current (14 header rule)
        run: python tools/build_root_docs.py --check

      # 3 — unit + architecture suite (13 §2.1 runs on every commit)
      - name: Unit tests
        run: pytest tests/unit tests/suites -q

  integration:
    runs-on: windows-latest
    needs: commit-tier
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Integration tests (real SQLite in temp dirs — 13 §2.3)
        run: pytest tests/integration -q

  # ui/ — parallel to the Python tiers, not gating them (18 §1.5: every
  # stage pays its own testing bill). Node 20 LTS pinned for CI
  # reproducibility; ui/package.json declares no engines field of its own.
  #
  # `ui/src/generated/` (ADR-011) is gitignored — a build artifact, not
  # checked-in source — so a fresh checkout has none of it and every
  # `../generated/*` import in ui/src fails to resolve. This job was
  # green locally at every session's own handoff (stale generated files
  # already sat on the local disk from a prior `npm run generate`) but
  # had been red on every real CI run since the job was added (found via
  # a fresh GitHub Actions run, not assumed): the generation step was
  # never wired in here. Python is needed too — the generator's Python
  # half (tools/generate_ts_client.py) boots a real throwaway Core to
  # fetch a live `registry.get` snapshot (12_API §1: every interface is a
  # client of the contract, generation included), which the Node half
  # (ui/scripts/generate-client.mjs) then compiles to TypeScript.
  ui:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install (Python — generator's Python half)
        run: pip install -e ".[dev]"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: ui/package-lock.json
      - name: Install (Node)
        working-directory: ui
        run: npm ci
      - name: Generate TS client from the live registry (ADR-011)
        run: |
          python tools/generate_ts_client.py
          cd ui
          npm run generate
      - name: Typecheck
        working-directory: ui
        run: npm run typecheck
      - name: Build
        working-directory: ui
        run: npm run build
      - name: UI-interaction tests (ADR-012)
        working-directory: ui
        run: npm run test
